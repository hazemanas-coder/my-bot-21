name: Run Minecraft AFK Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *' # بيشغل البوت ويجدده تلقائياً كل 5 ساعات

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm install mineflayer
          pip install -r requirements.txt

      - name: Run bot
        run: python bot.py
